name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        timeout-minutes: 3
        with:
          dotnet-version: '10.0.402'
      - name: Core regression tests
        run: dotnet test Tests/StickyNoteWPF.Tests.csproj -c Release --logger "trx;LogFileName=core.trx"
      - name: Build desktop app
        run: dotnet build StickyNoteWPF.csproj -c Release
      - name: WPF smoke checks
        timeout-minutes: 3
        run: dotnet run --project Tests/Windows/StickyNoteWPF.WindowsSmoke.csproj -c Release
      - name: Publish self-contained Windows app
        run: |
          dotnet publish StickyNoteWPF.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "${{ runner.temp }}/StickyNote-publish" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/publish.log"
          $publishExitCode = $LASTEXITCODE
          if ($publishExitCode -ne 0) {
            $details = (Get-Content "$env:RUNNER_TEMP/publish.log" -Tail 25) -join "`n"
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit $publishExitCode
          }
      - name: WPF and published application smoke checks
        run: dotnet run --project Tests/Windows/StickyNoteWPF.WindowsSmoke.csproj -c Release -- "${{ runner.temp }}/StickyNote-publish/StickyNote.exe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Tests/TestResults/*.trx
